name: Software Delivery Governance
on:
  push:
    paths:
      - '**/*.md'
  pull_request:
    paths:
      - '**/*.md'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Install validator tool
        run: |
          dotnet tool install -g SoftwareDelivery.GovernanceValidator --version 1.0.0 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
      - name: Run governance validator
        run: |
          GovernanceValidator .
      - name: Install link checker
        run: |
          dotnet tool install -g SoftwareDelivery.LinkChecker --version 1.0.0 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
      - name: Run link health check
        run: |
          LinkChecker .
      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: governance-report
          path: ./validation-report.txt