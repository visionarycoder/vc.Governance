name: Software Delivery Governance
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.0.x
            11.0.x
      - name: Build governance tools
        run: dotnet build tools/GovernanceTools.slnx --configuration Release
      - name: Run LSI validator tests
        run: dotnet run --project tools/governance-validator/tests/IntegrityValidatorTests.csproj --configuration Release --no-build
      - name: Validate LSI manifest example
        run: dotnet run --project tools/governance-validator/GovernanceValidator.csproj --configuration Release --no-build -- --integrity templates/logical-software-integrity/change-set.lsi.json
      - name: Run governance validator
        run: dotnet run --project tools/governance-validator/GovernanceValidator.csproj -- .
      - name: Run link health check
        run: dotnet run --project tools/link-checker/LinkChecker.csproj -- .
      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: governance-report
          path: ./validation-report.txt